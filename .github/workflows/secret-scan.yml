# Reusable secret scan workflow.
#
# Scans full git history and the working tree for committed secrets with
# gitleaks. Matches are redacted, so a found value is never printed in logs.
#
# Call it from a repo with .github/workflows/secret-scan.yml:
#
#   name: secret-scan
#   on: [push, pull_request]
#   jobs:
#     scan:
#       uses: Vantaneant-International-Ltd/.github/.github/workflows/secret-scan.yml@main

name: secret-scan (reusable)

on:
  workflow_call:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch org gitleaks config
        uses: actions/checkout@v4
        with:
          repository: Vantaneant-International-Ltd/.github
          path: .vnta-org-ci
      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan history and working tree
        run: gitleaks detect --no-banner --redact --config .vnta-org-ci/gitleaks.toml --source .
