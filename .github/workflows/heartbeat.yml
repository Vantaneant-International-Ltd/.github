# Daily heartbeat for every live VNTA property.
#
# Fetches each live site and both Supabase projects once a day. If anything is
# down it fails the run, writes a table to the run summary, and opens (or
# comments on) an issue titled "Heartbeat: a live property is down" in this
# repo, so a person is told without anyone having to look. When everything
# answers again, the next run closes that issue.
#
# It doubles as a keep-alive: the free Supabase plan pauses a project after
# about a week with no API traffic, which is what took the shared vendr/vnta
# database offline in September 2026. One authenticated REST request a day is
# enough to count as activity.
#
# Add a property: one more `probe` line. Remove one: delete its line.
# Run it by hand: Actions -> heartbeat -> Run workflow.
#
# Also emails studio@vnta.xyz a branded digest every single run, healthy or
# not, via Resend (RESEND_API_KEY secret, vnta.xyz verified sender). The
# email itself is built by .github/scripts/heartbeat_email.py in VNTA's own
# visual register (Marcellus/Manrope, monochrome, hairline dividers) and
# lists every property checked, not just the ones that failed, so the email
# is evidence of what ran, not just a claim that it did. That script lives in
# its own file rather than inline here because a multi-line script embedded
# in a YAML block scalar is one bad indent away from silently corrupting the
# whole workflow, which happened once already.
#
# The digest replaced an earlier attempt to send it from a scheduled Claude
# session; that session had no way to reach GitHub at all in this
# environment, so it silently did nothing. Sending straight from the
# workflow has no such dependency.
#
# Two cron times, not one: GitHub's own scheduler is best-effort and can
# silently skip a tick on a quiet repo, no error, no log, nothing to alert
# on (confirmed for real on 2026-09-07, when the 07:17 run just never
# happened). 08:17 is the backup. Its first step checks whether a scheduled
# run already succeeded today; if so, it stands down before doing anything
# else, so a normal day still gets exactly one email, and only a missed
# 07:17 causes 08:17 to actually run. Manual runs (Run workflow) always run
# in full and never skip.

name: heartbeat

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC, daily
    - cron: "17 8 * * *" # 08:17 UTC, backup in case 07:17 was silently skipped
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read # lets the 08:17 backup tick check today's run history via `gh run list`

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Publishable (anon) key for the vendr Supabase project, shared with vnta.
      # Public by design: it ships in both sites' client bundles and is
      # allowlisted in gitleaks.toml. Row-level security guards the data.
      # Sending it makes the request count as project activity (see above).
      VENDR_SUPABASE_ANON: sb_publishable_rpmSPCHja3L2Uy2_RrxjAA_Cz_NyHB2
      UA: "vnta-heartbeat/1 (+https://github.com/Vantaneant-International-Ltd/.github)"
    steps:
      # Only meaningful for the 08:17 backup tick: stands down if a
      # scheduled run already succeeded today, so a normal day still gets
      # exactly one email. Skipped entirely for a manual (Run workflow) run,
      # which always runs in full regardless of what already happened today.
      - name: Skip if a scheduled run already succeeded today
        id: guard
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          already="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow heartbeat.yml \
                       --limit 20 --json databaseId,event,conclusion,createdAt \
                       --jq "[.[] | select(.event==\"schedule\" and .conclusion==\"success\" and (.createdAt | startswith(\"$today\")) and .databaseId != $GITHUB_RUN_ID)] | length")"
          if [ "${already:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A scheduled run already succeeded today; this is the backup tick, standing down."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Needed only so the email step below can read heartbeat_email.py from
      # the repo; nothing else in this job touches repo files. This workflow
      # ran with no checkout at all until 2026-09-06, when adding that step
      # without adding a checkout broke it (the email step failed with the
      # working directory holding no repo content whatsoever).
      - uses: actions/checkout@v5
        if: steps.guard.outputs.skip != 'true'

      - name: Probe every live property
        id: check
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          # -e is deliberately off: one failure must not stop the other probes.
          set -uo pipefail
          fail=0
          report="$RUNNER_TEMP/report.md"
          printf '| Property | HTTP | Result |\n|---|---|---|\n' > "$report"

          # probe <name> <url> <expected-status-regex> [extra curl args...]
          probe() {
            local name="$1" url="$2" expect="$3"
            shift 3
            local code
            # curl prints 000 itself when it cannot connect; the fallback only
            # covers curl not running at all.
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L -A "$UA" \
                      --max-time 20 --retry 2 --retry-delay 5 "$@" "$url" 2>/dev/null || true)"
            code="${code:-000}"
            if [[ "$code" =~ $expect ]]; then
              printf '| %s | %s | ok |\n' "$name" "$code" >> "$report"
            else
              printf '| %s | %s | **DOWN** (expected %s) |\n' "$name" "$code" "$expect" >> "$report"
              echo "::error::$name answered $code, expected $expect: $url"
              fail=1
            fi
          }

          # Live sites. Any 2xx after redirects is alive.
          probe "vnta.xyz"          https://vnta.xyz          '^2..$'
          probe "eirvox.ie"         https://eirvox.ie         '^2..$'
          probe "vendr.ie"          https://vendr.ie          '^2..$'
          probe "maisonseul.com"    https://maisonseul.com    '^2..$'
          probe "tacet.social"      https://tacet.social      '^2..$'
          probe "buildt.ie"         https://buildt.ie         '^2..$'
          probe "ezgoautoworks.ie"  https://ezgoautoworks.ie  '^2..$'

          # Supabase. A live project answers REST; a paused one answers 5xx or nothing.
          # vendr (shared with vnta): sent with the public key, so it is a keep-alive too.
          # The bare /rest/v1/ root can answer 401 even with a valid key (PostgREST
          # wants a real table path to authorize against, not the root) — a real
          # first-run false alarm on 2026-09-06 confirmed this. 401 still proves the
          # project is awake and answering, which is all "not paused" needs.
          probe "supabase: vendr + vnta" \
            "https://fmmvqlqdhytcxeucdfbj.supabase.co/rest/v1/" '^[24]..$' \
            -H "apikey: $VENDR_SUPABASE_ANON" -H "Authorization: Bearer $VENDR_SUPABASE_ANON"
          # eirvox: its key is not in this repo, so a healthy project answers 401
          # (key required). Only a 5xx or no answer means down.
          probe "supabase: eirvox" \
            "https://arokrumaxjiidsqfpiii.supabase.co/rest/v1/" '^[24]..$'

          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          exit "$fail"

      - name: Open or update the heartbeat issue
        if: failure() && steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Heartbeat: a live property is down"
          body="$(printf 'The daily heartbeat found at least one property down.\n\nRun: %s\n\n' "$RUN_URL"; cat "$RUNNER_TEMP/report.md")"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                        --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close the heartbeat issue once everything answers
        if: success() && steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Heartbeat: a live property is down"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                        --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "Every property answered on $(date -u +%F). Closing."
          fi

      - name: Email studio@vnta.xyz a branded digest
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true # a failed email must never fail the whole run
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FAIL: ${{ steps.check.outputs.fail }}
          ISSUES_URL: https://github.com/${{ github.repository }}/issues?q=is%3Aissue+is%3Aopen+%22Heartbeat%3A+a+live+property+is+down%22+in%3Atitle
        run: |
          set -uo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "RESEND_API_KEY not set; skipping the digest email." >&2
            exit 0
          fi

          payload="$(REPORT_PATH="$RUNNER_TEMP/report.md" TODAY="$(date -u +%F)" \
            python3 .github/scripts/heartbeat_email.py)"

          curl -sS --max-time 20 -o /tmp/resend_response.json -w 'Resend responded %{http_code}\n' \
            -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload"
          cat /tmp/resend_response.json
